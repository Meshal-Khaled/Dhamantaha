# The website's web server. It serves the built pages and forwards /v1 (and only /v1) to The Ring's API
# container, so the browser talks to one address and no cross-origin (CORS) setup is needed.

map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml text/plain;

  # Docker's own name service. The API container is looked up on every request (not once at start-up),
  # so it can be rebuilt or restarted without restarting this server.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Liveness check for Docker and quick tests. Not a page.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # The analysis API. Uploads can be 20 MB photos and answers can take up to ~90 seconds (Cloudflare allows 100).
  # Nothing else of The Ring is reachable from here: the admin dashboard and API docs are not forwarded.
  location /v1/ {
    set $ring http://infrastructure:3100;
    proxy_pass $ring;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    client_max_body_size 25m;
    proxy_request_buffering off;   # stream uploads through; this container's disk is read-only
    proxy_connect_timeout 5s;
    proxy_send_timeout 100s;
    proxy_read_timeout 100s;
  }

  # Built files carry a content hash in their name, so they can be cached for good.
  location /assets/ {
    include /etc/nginx/headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Everything else is a page of the app (or a static file next to it). Unknown paths get the app, which
  # shows its own "page not found". The page itself is never cached, so a new release shows up on the next visit.
  location / {
    include /etc/nginx/headers.inc;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
