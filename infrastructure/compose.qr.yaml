services:
  qr:
    image: dhamantaha-infrastructure:latest
    user: "${RING_UID:-1001}:${RING_GID:-1001}"
    command: [node, src/qr-server.js]
    environment:
      HOST: 0.0.0.0
      PORT: "3100"
      ANALYSIS_PROVIDER: gemini
      GEMINI_MODEL: ${QR_GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_API_KEY_FILE: /run/secrets/gemini_api_key
      GEMINI_FALLBACK_KEY_FILES: /run/secrets/gemini_api_key_2,/run/secrets/gemini_api_key_3
      GEMINI_FALLBACK_MODELS: "${QR_FALLBACK_MODELS:-}"
      GEMINI_TIMEOUT_MS: "25000"
      GEMINI_TOTAL_TIMEOUT_MS: "85000"
      GEMINI_HEDGE_AFTER_MS: "0"
      CLIENT_KEYS: ""
      ADMIN_STATE_DIRECTORY: /app/state
      DEBUG_CAPTURE: "false"
      ENABLE_API_DOCS: "false"
      TRUST_PROXY: loopback,uniquelocal
      MAX_CONCURRENT_ANALYSES: "5"
      RATE_LIMIT_PER_MINUTE: "300"
      DAILY_PROVIDER_CALL_LIMIT: "500"
      # Only the API, holding the same token, may read or delete QR users through /internal.
      QR_INTERNAL_TOKEN_FILE: /run/secrets/qr_internal_token
    volumes:
      - ../qr-state:/app/state
    secrets: [gemini_api_key, gemini_api_key_2, gemini_api_key_3, qr_internal_token]
    read_only: true
    tmpfs: [/tmp:size=16m]
    mem_limit: 2048m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

secrets:
  # Shared by the API and the QR backend for the private Users/monitoring link (32+ random characters, mode 0600).
  qr_internal_token:
    file: ${QR_INTERNAL_TOKEN_SOURCE:-/home/ubuntu/dhamantaha/secrets/qr-internal.token}
