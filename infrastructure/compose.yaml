services:
  infrastructure:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
    ports:
      # Published on loopback only; put the reverse proxy in front for HTTPS.
      - "127.0.0.1:${PORT:-3000}:3000"
    # Receipts must never touch disk: the container cannot write anywhere except a small /tmp in memory.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    mem_limit: 768m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
